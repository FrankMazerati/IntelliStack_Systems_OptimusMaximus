name = "intellistack-business-api"
main = "src/index.js"
compatibility_date = "2026-10-16"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "intellistack-command-center"
database_id = "REPLACE_WITH_CREATED_D1_DATABASE_ID"
migrations_dir = "../d1"

[vars]
# Configure these in the Worker dashboard or with Wrangler secrets/vars.
# JWT_ISSUER = "https://your-identity-provider/"
# JWT_AUDIENCE = "your-api-audience"
# JWT_JWKS_URL = "https://your-identity-provider/.well-known/jwks.json"
# ALLOWED_ORIGINS = "https://maximusoptimus.netlify.app,https://main--maximusoptimus.netlify.app"
